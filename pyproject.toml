[project]
name = "doran"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["doran-ai"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ai", "server"]

[tool.uv.sources]
doran-ai = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["ai/tests", "server/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
