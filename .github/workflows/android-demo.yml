name: android-demo

# 머지 전 확인: JDK 21로 단위 테스트와 빌드, 에뮬레이터에서 시연 흐름 한 번(서버 켜고 → 끄고).
# 결과(단계별 화면, result.txt, logcat)는 Actions 실행 페이지의 demo-flow에서 받는다
on:
  workflow_dispatch:
  # 새 워크플로는 기본 브랜치에 올라가기 전까지 직접 실행할 수 없어서, 이 파일이나 시연 스크립트를 바꾸면 돈다
  push:
    paths: [".github/workflows/android-demo.yml", "app/scripts/demo_flow.sh"]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM 사용 허용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # 앱은 JDK 17 툴체인으로 컴파일하고, Gradle은 JDK 21에서 돈다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: JDK 확인
        run: java -version
      - name: 단위 테스트
        working-directory: app
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK 빌드
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: AI 서버 켜기 (시연 여행 기록 자동 입력 켬)
        run: |
          uv sync --locked --all-packages
          nohup uv run python -m server.main > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
      - name: 에뮬레이터에서 시연 흐름
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          # 호스트로 GL 명령을 넘기는 swiftshader_indirect는 셰이더를 만들 때마다 앱 화면 스레드가 몇 초씩 묶여
          # 첫 화면에서 "응답 없음"이 나곤 했다. 에뮬레이터 안에서 바로 그리는 guest로 돌린다
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim
          working-directory: app
          script: bash scripts/demo_flow.sh demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-flow
          path: |
            app/demo/
            server.log
          retention-days: 7
