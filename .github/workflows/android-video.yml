name: android-video

# 접수용 시연 영상. 에뮬레이터에서 시연 흐름을 녹화하고(app/scripts/demo_video.sh), 사람이 한 말과 장면 이름을 자막으로 입힌다.
# 결과는 Actions 실행 페이지의 demo-video에서 받는다(doran_demo.mp4)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/android-video.yml", "app/scripts/demo_video.sh"]

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM 사용 허용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: AI 서버 켜기 (시연 여행 기록 자동 입력 켬)
        run: |
          uv sync --locked --all-packages
          nohup uv run python -m server.main > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
      - name: 에뮬레이터에서 녹화
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app
          script: bash scripts/demo_video.sh video
      - name: 조각 잇고 자막 입히기
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
          python3 app/scripts/burn_captions.py app/video app/video/doran_demo.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: |
            app/video/
            server.log
          retention-days: 7
