# 심사·시연용 AI 서버. Render 무료 웹 서비스(15분 동안 요청이 없으면 잠들고, 다음 요청에 1분 안쪽으로 깬다)
# 무료 서비스는 디스크가 남지 않아 다시 켤 때마다 DB가 비고, 시연 여행 3건을 새로 넣는다
services:
  - type: web
    name: doran-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install uv && uv sync --all-packages --frozen --no-dev
    startCommand: uv run --no-sync python -m server.main
    healthCheckPath: /health
    # 제출 전까지는 develop에 올라오면 바로 다시 배포한다. 제출 뒤에는 main으로 바꾸고 자동 배포를 끈다
    branch: develop
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DORAN_HOST
        value: 0.0.0.0
      - key: DORAN_REGION
        value: gangneung
      - key: DORAN_SEED_DEMO
        value: "1"
      - key: DORAN_LLM_ENDPOINT
        value: https://api.groq.com/openai/v1/chat/completions
      - key: DORAN_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: DORAN_LLM_TIMEOUT_SECONDS
        value: "8"
      # 키는 저장소에 넣지 않는다. Render 화면에서 직접 입력한다
      - key: GROQ_API_KEY
        sync: false
